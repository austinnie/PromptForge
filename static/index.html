<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptForge 工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>input, textarea, select { font-size: 16px !important; }</style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col gap-4 font-sans max-w-4xl mx-auto">

    <header class="text-center py-2 border-b border-gray-700 flex justify-between items-center">
        <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">🔥 PromptForge</h1>
        <span class="text-xs px-2 py-1 bg-green-900 text-green-300 rounded border border-green-700" id="status-text">等待连接...</span>
    </header>

    <!-- 配置区 -->
    <section class="bg-gray-800 rounded-xl p-4 shadow-lg grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="text-sm text-gray-400 mb-1 block">🔌 生图引擎 (Provider)</label>
            <select id="provider-select" class="w-full bg-gray-700 rounded-lg p-2 text-sm focus:outline-none">
                <option value="local_sd">本地算力 (Local SD)</option>
                <option value="agnes">云端 API (Agnes)</option>
                <option value="pollinations">云端 API (Pollinations)</option>
            </select>
        </div>
        <div>
            <label class="text-sm text-gray-400 mb-1 block">🎨 本地模型 (Model)</label>
            <select id="model-select" class="w-full bg-gray-700 rounded-lg p-2 text-sm focus:outline-none">
                <option value="">加载中...</option>
            </select>
        </div>
    </section>

    <!-- 输入区 -->
    <section class="bg-gray-800 rounded-xl p-4 shadow-lg flex flex-col gap-3">
        <textarea id="prompt-input" rows="2" placeholder="输入指令或画面描述..." 
            class="w-full bg-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
        <div class="flex gap-2">
            <button onclick="sendChat()" class="flex-1 bg-gray-600 hover:bg-gray-500 font-medium py-2 rounded-lg text-sm transition">
                💬 发送指令 (Chat)
            </button>
            <button onclick="generateImage()" class="flex-[2] bg-blue-600 hover:bg-blue-500 font-bold py-2 rounded-lg text-sm transition shadow-lg shadow-blue-500/30">
                ✨ 生成图片 (Image)
            </button>
        </div>
    </section>

    <!-- 结果展示区 -->
    <section class="flex-1 flex flex-col gap-4">
        <!-- 文本输出 -->
        <div id="chat-result" class="hidden bg-gray-800 rounded-xl p-4 text-sm font-mono text-green-400 break-all whitespace-pre-wrap"></div>
        
        <!-- 图片输出 -->
        <div id="image-container" class="hidden flex-1 flex flex-col bg-gray-800 rounded-xl p-2 relative min-h-[300px]">
            <div id="loading" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-800/80 hidden z-10">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500 mb-2"></div>
                <p class="text-xs text-blue-400">正在生成，请耐心等待...</p>
            </div>
            <img id="result-image" class="w-full h-auto rounded-lg object-contain" src="" alt="生成的图片">
            <p id="image-caption" class="text-xs text-center text-gray-400 mt-2"></p>
        </div>
    </section>

    <script>
        const API_BASE = window.location.origin; 

        // 1. 页面加载时获取模型列表
        async function loadModels() {
            try {
                const res = await fetch(`${API_BASE}/api/models`);
                const data = await res.json();
                const select = document.getElementById('model-select');
                select.innerHTML = '';
                
                if (data.data && data.data.length > 0) {
                    data.data.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.id;
                        opt.textContent = `[${m.base.toUpperCase()}] ${m.name}`;
                        select.appendChild(opt);
                    });
                    document.getElementById('status-text').textContent = "✅ 已连接";
                } else {
                    select.innerHTML = '<option value="">无可用模型</option>';
                }
            } catch (err) {
                document.getElementById('status-text').textContent = "❌ 断线";
                document.getElementById('status-text').className = "text-xs px-2 py-1 bg-red-900 text-red-300 rounded border border-red-700";
            }
        }

        // 2. 发送文本指令
        async function sendChat() {
            const text = document.getElementById('prompt-input').value.trim();
            if (!text) return;
            const chatResult = document.getElementById('chat-result');
            chatResult.classList.remove('hidden');
            chatResult.textContent = "⏳ 识别意图中...";
            
            // 顺便隐藏图片区
            document.getElementById('image-container').classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await res.json();
                chatResult.textContent = "意图解析结果:\n" + JSON.stringify(data, null, 2);
            } catch (err) {
                chatResult.textContent = `❌ 请求失败: ${err.message}`;
            }
        }

        // 3. 生成图片
        async function generateImage() {
            const prompt = document.getElementById('prompt-input').value.trim();
            if (!prompt) return alert("请输入提示词！");

            const provider = document.getElementById('provider-select').value;
            const modelId = document.getElementById('model-select').value;

            const imageContainer = document.getElementById('image-container');
            const loading = document.getElementById('loading');
            const imgEl = document.getElementById('result-image');
            const caption = document.getElementById('image-caption');
            const chatResult = document.getElementById('chat-result');

            chatResult.classList.add('hidden');
            imageContainer.classList.remove('hidden');
            loading.classList.remove('hidden');
            imgEl.src = ''; caption.textContent = '';

            try {
                const res = await fetch(`${API_BASE}/api/generate_image`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        width: 768, height: 768, steps: 25,
                        primary_provider: provider,
                        model_id: modelId
                    })
                });
                
                const data = await res.json();
                loading.classList.add('hidden');

                if (data.status === 'success') {
                    imgEl.src = `${API_BASE}${data.image_url}`;
                    caption.textContent = `来源: ${data.provider}`;
                } else {
                    alert("生成失败：" + JSON.stringify(data));
                }
            } catch (err) {
                loading.classList.add('hidden');
                alert("请求失败：" + err.message);
            }
        }

        window.onload = loadModels;
    </script>
</body>
</html>
